spring:
  application:
    name: medical-booking

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/medical_booking_db}
    username: ${DATASOURCE_USERNAME:medical_booking_usr}
    password: ${DATASOURCE_PASSWORD:medical_booking_pwd}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The payload is already JSON in the outbox row and is sent as it is.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html

booking:
  slot-duration: PT30M
  clinic-zone: Europe/Lisbon

kafka-topic:
  name: appointment-events
  partitions: 3
  # The outbox keeps events for 30 days, so the topic only has to cover a consumer being down.
  retention: P7D

notification:
  from-address: appointments@clinic.example.com

kafka-consumer:
  max-attempts: 4
  initial-backoff: PT1S
  backoff-multiplier: 2.0

outbox:
  poll-interval: PT1S
  batch-size: 100
  retention: P30D
  cleanup-interval: PT1H
